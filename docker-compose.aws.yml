# ─────────────────────────────────────────────────────────────────────────────
# Noēsis — AWS PRODUCTION OVERLAY (nginx reverse proxy behind an AWS ALB).
# TLS is terminated by the AWS Application Load Balancer (ACM cert) — NOT here.
# Use this INSTEAD of docker-compose.prod.yml (which is the Traefik/self-TLS path).
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build \
#       nginx guide mysql grid dashboard steward   # (add coturn for P2P)
#
# Topology:
#   Route 53 ─HTTPS:443(ACM)─▶ ALB ─HTTP─▶ EC2:${NGINX_HTTP_PORT} (nginx) ─▶ containers
#
# Hostname routing (nginx server_name):
#   ${DOMAIN}        → dashboard (/, the landing page) · guide (/docs) · steward (/console)
#   api.${DOMAIN}    → grid (Portal + Grid)                       ← REQUIRED
#   portal.${DOMAIN} → dashboard (Tier-3 Portal Manager console; / → /system/portal-manager)
#   coturn.${DOMAIN} → coturn — NOT through the ALB/nginx (TURN is not HTTP).
#                      Use an NLB or the EC2 elastic IP; open UDP/TCP 3478 + TLS 5349.
#
# Ports: nginx publishes ${NGINX_HTTP_PORT:-80} on the host (point the ALB target
# group at it). Other host services use 3000/5000/5001/7001 — nginx avoids those;
# the app containers (3001/3002/8080/3306) are reachable only inside the Docker
# network + the EC2 security group, never via the ALB.
#
# Required env (.env):  DOMAIN=noesiis.com   (NGINX_HTTP_PORT optional, default 80)
# No ACME_EMAIL / Let's Encrypt — the ALB owns the certificate.
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── nginx: the in-host reverse proxy the ALB forwards to ────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: noesis-nginx
    depends_on:
      - guide
      - wiki
      - grid
      - dashboard
      - steward
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Substitute ONLY ${DOMAIN} in the template; preserve nginx's own $variables.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./docker/nginx.noesiis.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    restart: unless-stopped

  # ── Services Guide (static docs at /docs) — reached internally by the proxy ─
  guide:
    build:
      context: .
      dockerfile: docker/Dockerfile.guide
    container_name: noesis-guide
    restart: unless-stopped

  # ── Wiki (single source of truth — MkDocs static at /wiki) ──────────────────
  wiki:
    build:
      context: .
      dockerfile: docker/Dockerfile.wiki
    container_name: noesis-wiki
    restart: unless-stopped

  # ── Portal + Grid (api.${DOMAIN}). Allow the apex + portal-subdomain origins ─
  grid:
    environment:
      GRID_CORS_ORIGINS: "https://${DOMAIN:-localhost},https://portal.${DOMAIN:-localhost}"

  # ── Dashboard → ${DOMAIN}/ (apex — the landing page is the first page) ──────
  dashboard:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: ""
        NEXT_PUBLIC_GRID_ORIGIN: "https://api.${DOMAIN:-localhost}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/dash/health"]

  # ── Steward Console → ${DOMAIN}/console (Next basePath=/console) ────────────
  steward:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: "/console"
        NEXT_PUBLIC_GRID_ORIGIN: "https://api.${DOMAIN:-localhost}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/console/api/health"]

  # ── coturn (P2P) — behind a SEPARATE AWS NLB (NOT the ALB) ──────────────────
  # The ALB is L7/HTTP and cannot carry STUN/TURN. Create an NLB (L4) and point
  # coturn.${DOMAIN} at it. The relay range is shrunk so total NLB listeners stay
  # under the default ~50 quota: 44 relay (UDP 49152-49195) + 3478 udp/tcp + 5349
  # tcp = 47 listeners. coturn advertises the NLB's IP via --external-ip.
  # Only needed when Brain-to-Brain P2P is enabled.
  coturn:
    environment:
      DETECT_EXTERNAL_IP: "no"
    command: >
      -f
      --use-auth-secret
      --realm=noesis.grid
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-changeme-turn-secret}
      --min-port=${TURN_RELAY_MIN:-49152}
      --max-port=${TURN_RELAY_MAX:-49195}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
    ports:
      - "${TURN_RELAY_MIN:-49152}-${TURN_RELAY_MAX:-49195}:${TURN_RELAY_MIN:-49152}-${TURN_RELAY_MAX:-49195}/udp"
