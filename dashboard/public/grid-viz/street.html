<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noēsis — Street View (Genesis)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #06070c; color: #e6e8ef; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; max-width: 340px; pointer-events: none; }
  #hud h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .3px; }
  #hud .meta { color: #9aa0ad; }
  #source { color: #9aa0ad; }
  #controls { position: fixed; bottom: 12px; left: 12px; z-index: 6; display: flex; gap: 8px; }
  button { pointer-events: auto; background: #161a26; color: #e6e8ef; border: 1px solid #2a3142; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #1d2230; }
  #info { position: fixed; top: 12px; right: 12px; z-index: 6; width: 260px; background: #0d1018ee; border: 1px solid #2a3142; border-radius: 10px; padding: 12px 14px; display: none; }
  #info h2 { font-size: 13px; margin: 0 0 6px; }
  #info .row { color: #9aa0ad; margin: 2px 0; }
  #info .row b { color: #e6e8ef; }
  #hint { position: fixed; bottom: 12px; right: 12px; z-index: 5; color: #6b7280; }
  #loaderr { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #06070c; color: #ff7373; z-index: 9; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <h1>Genesis — Street View</h1>
  <div class="meta">parcels: <b id="parcel-count">0</b> · <span id="source">local demo</span></div>
</div>
<div id="controls">
  <button id="walk">Enter walk mode</button>
  <button id="overview">Overview</button>
</div>
<div id="info"></div>
<div id="hint">drag to look · scroll to zoom · click a building to inspect · walk: WASD + mouse</div>
<div id="loaderr">WebGL unavailable — this view needs a GPU-backed browser.</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script src="./address-to-world.js"></script>
<script type="module" src="./street.js"></script>
</body>
</html>
