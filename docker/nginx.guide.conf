# Noēsis Services Guide — nginx static server
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (the guide is HTML+CSS+JS in one file).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Liveness probe used by the container HEALTHCHECK + Traefik.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Static cache headers for the docs assets.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Clean URLs: pages never expose .html — old links 301 to the clean path,
    # and extensionless paths resolve to the underlying .html file.
    rewrite ^(/.+)\.html$ $1 permanent;

    # Serve files; fall back to the landing page so deep links don't 404.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
