# Noēsis Wiki — nginx static server (served under /wiki/)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Liveness probe for the container HEALTHCHECK + reverse proxy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Bare /wiki → /wiki/ so the index resolves.
    location = /wiki { return 302 /wiki/; }

    # Cache the static assets MkDocs emits.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Serve the wiki. Unknown paths return a real 404 with the styled MkDocs
    # "Page not found" page (so retired URLs — e.g. the moved dev docs — 404
    # honestly rather than silently serving the home page with a 200).
    location /wiki/ {
        try_files $uri $uri/ =404;
    }
    error_page 404 /wiki/404.html;
}
