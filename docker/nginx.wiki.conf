# Noēsis Wiki — nginx static server (served under /wiki/)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Liveness probe for the container HEALTHCHECK + reverse proxy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Bare /wiki → /wiki/ so the index resolves.
    location = /wiki { return 302 /wiki/; }

    # Cache the static assets MkDocs emits.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Serve the wiki; fall back to the wiki home so deep links don't 404.
    location /wiki/ {
        try_files $uri $uri/ /wiki/index.html;
    }
}
