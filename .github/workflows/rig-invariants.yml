name: rig-invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: grid/package.json

      - name: T-10-12 + T-10-13 grep gates
        run: node scripts/check-rig-invariants.mjs

      - name: OBS-03 no-silent-catch gate (Phase 31)
        run: node scripts/check-no-silent-catch.mjs

      - name: OBS-R-32-01 observability-no-TODO gate (Phase 32)
        run: node scripts/check-observability-no-todo.mjs

      - name: OBS-R-32-02 setInterval-lifecycle gate (Phase 32)
        run: node scripts/check-interval-lifecycle.mjs

      - name: OBS-09 sole-producer-discipline gate (Phase 33)
        run: node scripts/check-sole-producer-discipline.mjs

      - name: OBS-36-01 ROUTE_DID_POLICY coverage gate (Phase 36 VIS-04)
        run: node scripts/check-did-policy-coverage.mjs

      - name: OBS-36-02 /admin/* policy isolation gate (Phase 36 D-36-10)
        run: node scripts/check-admin-policy-isolation.mjs

      - name: OBS-36-03 WS firehose zero-diff regression gate (Phase 36 R-31-01)
        run: node scripts/check-ws-redaction-zero-diff.mjs

      - name: OBS-36-04 No-DID exception count gate (Phase 36 D-V3-15 amended)
        run: node scripts/check-no-did-exception-count.mjs

      - name: Fast Vitest rig suite (Wave 0/1/2 — NOESIS_RUN_NIGHTLY unset, rig-bench skips)
        working-directory: grid
        run: |
          npm ci
          npx vitest run test/rig/
