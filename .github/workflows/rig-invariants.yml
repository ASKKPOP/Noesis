name: rig-invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: grid/package.json

      - name: T-10-12 + T-10-13 grep gates
        run: node scripts/check-rig-invariants.mjs

      - name: OBS-03 no-silent-catch gate (Phase 31)
        run: node scripts/check-no-silent-catch.mjs

      - name: OBS-R-32-01 observability-no-TODO gate (Phase 32)
        run: node scripts/check-observability-no-todo.mjs

      - name: OBS-R-32-02 setInterval-lifecycle gate (Phase 32)
        run: node scripts/check-interval-lifecycle.mjs

      - name: OBS-09 sole-producer-discipline gate (Phase 33)
        run: node scripts/check-sole-producer-discipline.mjs

      - name: OBS-36-01 ROUTE_DID_POLICY coverage gate (Phase 36 VIS-04)
        run: node scripts/check-did-policy-coverage.mjs

      - name: OBS-36-02 /admin/* policy isolation gate (Phase 36 D-36-10)
        run: node scripts/check-admin-policy-isolation.mjs

      - name: OBS-36-03 WS firehose zero-diff regression gate (Phase 36 R-31-01)
        run: node scripts/check-ws-redaction-zero-diff.mjs

      - name: OBS-36-04 No-DID exception count gate (Phase 36 D-V3-15 amended)
        run: node scripts/check-no-did-exception-count.mjs

      - name: OBS-37-01 civic-DID issuance path gate (Phase 37 D-V3-33)
        run: node scripts/check-civic-did-issuance-path.mjs

      - name: TENANT-02 check-operator-scope-typing (Phase 39)
        run: node scripts/check-operator-scope-typing.mjs

      - name: POL-05 no operator-direct sanction path (Phase 47 D-V3-18)
        run: node scripts/check-no-operator-sanction-path.mjs

      - name: TYPE-B-04 no bios.death from treasury exhaustion (Phase 45b D-V3-25)
        run: node scripts/check-treasury-no-bios-death.mjs

      - name: PORTAL-06 cross-Grid framework stays dormant in v3.0 (Phase 55)
        run: node scripts/check-cross-grid-dormant.mjs

      - name: MAP-SYNC canonical map ↔ dashboard copy identical (W-C6, space-viz canon)
        run: node scripts/check-map-sync.mjs

      - name: MONEY-62.5-05 Ledger-B retired — no transferWei / nous_registry balance_wei money
        run: node scripts/check-ledger-b-money.mjs

      - name: D-11 STATE.md ↔ broadcast-allowlist doc sync (Phase 5)
        run: node scripts/check-state-doc-sync.mjs

      - name: D-9-08 no client graph-layout libs + allowlist baseline (Phase 9)
        run: node scripts/check-relationship-graph-deps.mjs

      - name: D-10b-09 no wall-clock reads in Bios/Chronos/retrieval/replay (Phase 10b)
        run: node scripts/check-wallclock-forbidden.mjs

      - name: D-11-08 whisper plaintext + keyring isolation (Phase 11)
        run: node scripts/check-whisper-plaintext.mjs

      - name: VOTE-05 governance isolation (Phase 12 D-12-11)
        run: node scripts/check-governance-isolation.mjs

      - name: VOTE-05 governance body privacy (Phase 12 D-12-11)
        run: node scripts/check-governance-plaintext.mjs

      - name: VOTE-06 no vote weighting (Phase 12 D-12-11)
        run: node scripts/check-governance-weight.mjs

      - name: D-25b-11 operator-sanctions plaintext (Phase 25b)
        run: node scripts/check-operator-sanctions-plaintext.mjs

      - name: No header-trust auth in operator/admin/governance routes
        run: node scripts/check-operator-header-auth.mjs

      - name: D-25a-05 cognitive-snapshot plaintext (Phase 25a)
        run: node scripts/check-cognitive-snapshot-plaintext.mjs

      - name: HOUSE-3 cross-House prompt-injection — visitor content stays data (Phase 60)
        run: node scripts/check-cross-house-injection.mjs

      - name: T-10-07 replay engine is read-only (Phase 13)
        run: node scripts/check-replay-readonly.mjs

      - name: D-WIKI-04 wiki integrity (front-matter, At-a-glance, one canonical per topic)
        run: node scripts/check-wiki.mjs

      - name: Every scripts/check-*.mjs gate is run by a workflow
        run: node scripts/check-gates-wired.mjs

      - name: Triple Verification registry — every property has its TLA+, Lean and property-test file; no sorry/axiom
        run: node scripts/check-verification.mjs

      - name: Ratchet — copied anti-patterns may only go down (inline id regex, useEffect, type escapes, suppressions, UI timers)
        run: node scripts/check-ratchet.mjs

      - name: Fast Vitest rig suite (Wave 0/1/2 — NOESIS_RUN_NIGHTLY unset, rig-bench skips)
        working-directory: grid
        run: |
          npm ci
          npx vitest run test/rig/
