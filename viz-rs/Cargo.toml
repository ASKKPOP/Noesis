[package]
name = "noesis-viz"
version = "0.1.0"
edition = "2021"
description = "Noēsis world view in Bevy (option C): the orbital Genesis station, compiled to WASM for the dashboard. three.js stays as the fallback."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["render"]
# The Bevy scene. Off = only the pure layout module (fast `cargo test --no-default-features`).
render = ["dep:bevy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.20.1", optional = true, default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "mouse",
    "touch",
    "webgl2",
] }

# Native Linux (CI's `cargo test`) needs a winit backend; x11 loads its libraries at run time.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20.1", optional = true, default-features = false, features = ["x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
proptest = "1.12.0"
