version: "3.8"

services:

  # ── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: noesis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noesis_grid}
      MYSQL_USER: ${MYSQL_USER:-noesis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Grid Service ─────────────────────────────────────────────────────────────
  grid:
    build:
      context: .
      dockerfile: docker/Dockerfile.grid
    container_name: noesis-grid
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${GRID_PORT:-8080}:8080"
    environment:
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noesis_grid}
      MYSQL_USER: ${MYSQL_USER:-noesis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      # Grid
      GRID_NAME: ${GRID_NAME:-Genesis}
      GRID_DOMAIN: ${GRID_DOMAIN:-genesis.noesis}
      GRID_PORT: 8080
      GRID_TICK_RATE_MS: ${GRID_TICK_RATE_MS:-30000}
      # W4 (D-MONEY-09) — model-first endowment, the live wei source. Default OFF;
      # set GRID_ENDOWMENT_ENABLED=true in .env to enable the operator-gated endow route.
      GRID_ENDOWMENT_ENABLED: ${GRID_ENDOWMENT_ENABLED:-false}
      # Tier-3 Portal Manager console (read-only reviewer queue at portal.${DOMAIN}
      # / dashboard /system/portal-manager). Dedicated flag, DECOUPLED from
      # GRID_ADMIN_ENABLED — enabling this does NOT enable admin .env routes.
      # Default OFF → route 503s (portal_manager_disabled).
      GRID_PORTAL_MANAGER_ENABLED: ${GRID_PORTAL_MANAGER_ENABLED:-false}
      # Local Management Site admin routes (post-v2.6, default OFF)
      GRID_ADMIN_ENABLED: ${GRID_ADMIN_ENABLED:-false}
      GRID_ADMIN_DOCKER_ENABLED: ${GRID_ADMIN_DOCKER_ENABLED:-false}
      GRID_ADMIN_ENV_PATH: /admin/.env
      GRID_ADMIN_PROJECT_DIR: /admin/project
      # Phase 42 P2P-03 — coturn TURN credential generation
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-changeme-turn-secret}
      TURN_HOST: ${TURN_HOST:-coturn}
      TURN_PORT: ${TURN_PORT:-3478}
    volumes:
      - sockets:/sockets
      # Admin mounts — only active when GRID_ADMIN_ENABLED=true. When the env is
      # absent or false, every /api/v1/admin/* returns 503 and these mounts are
      # zero-functional-impact (just filesystem availability).
      - ./.env:/admin/.env
      - .:/admin/project:ro
      # Docker socket mount is the high-risk one — only mount when
      # GRID_ADMIN_DOCKER_ENABLED=true is the operator's deliberate choice. The
      # mount is harmless without the env flag (Grid never invokes docker without it).
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Nous: Sophia (Philosopher, Agora) ────────────────────────────────────────
  nous-sophia:
    build:
      context: .
      dockerfile: docker/Dockerfile.brain
    container_name: noesis-nous-sophia
    depends_on:
      grid:
        condition: service_healthy
    environment:
      NOUS_NAME: sophia
      NOUS_CONFIG: /app/data/nous/sophia.yaml
      GRID_NAME: ${GRID_NAME:-Genesis}
      GRID_ENDPOINT: http://grid:8080
      NOUS_REGION: agora
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      SOCKET_DIR: /sockets
    volumes:
      - sockets:/sockets
    restart: unless-stopped

  # ── Nous: Hermes (Trader, Market) ────────────────────────────────────────────
  nous-hermes:
    build:
      context: .
      dockerfile: docker/Dockerfile.brain
    container_name: noesis-nous-hermes
    depends_on:
      grid:
        condition: service_healthy
    environment:
      NOUS_NAME: hermes
      NOUS_CONFIG: /app/data/nous/hermes.yaml
      GRID_NAME: ${GRID_NAME:-Genesis}
      GRID_ENDPOINT: http://grid:8080
      NOUS_REGION: market
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      SOCKET_DIR: /sockets
    volumes:
      - sockets:/sockets
    restart: unless-stopped

  # ── Nous: Themis (Lawkeeper, Council) ────────────────────────────────────────
  nous-themis:
    build:
      context: .
      dockerfile: docker/Dockerfile.brain
    container_name: noesis-nous-themis
    depends_on:
      grid:
        condition: service_healthy
    environment:
      NOUS_NAME: themis
      NOUS_CONFIG: /app/data/nous/themis.yaml
      GRID_NAME: ${GRID_NAME:-Genesis}
      GRID_ENDPOINT: http://grid:8080
      NOUS_REGION: council
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      SOCKET_DIR: /sockets
    volumes:
      - sockets:/sockets
    restart: unless-stopped

  # ── Dashboard (Next.js 15 standalone) ────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        # NEXT_PUBLIC_* must be baked at build time (Next 15 inlines them).
        NEXT_PUBLIC_GRID_ORIGIN: ${NEXT_PUBLIC_GRID_ORIGIN:-http://localhost:8080}
    container_name: noesis-dashboard
    depends_on:
      grid:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    environment:
      # Runtime env for parity — standalone rarely reads NEXT_PUBLIC_* at runtime,
      # but this keeps dev/prod environments symmetric. Actual client values
      # come from the build-arg baked into the bundle above.
      NEXT_PUBLIC_GRID_ORIGIN: ${NEXT_PUBLIC_GRID_ORIGIN:-http://localhost:8080}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/dash/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Steward Console (operator admin, Next.js 15 standalone) ─────────────────
  steward:
    build:
      context: .
      dockerfile: docker/Dockerfile.steward
      args:
        NEXT_PUBLIC_GRID_ORIGIN: ${NEXT_PUBLIC_GRID_ORIGIN:-http://localhost:8080}
    container_name: noesis-steward
    depends_on:
      grid:
        condition: service_healthy
    ports:
      - "${STEWARD_PORT:-3002}:3002"
    environment:
      NEXT_PUBLIC_GRID_ORIGIN: ${NEXT_PUBLIC_GRID_ORIGIN:-http://localhost:8080}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3002
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── coturn STUN/TURN (Phase 42 P2P-03 / D-42-03) ────────────────────────────
  # TURN is FREE in v3.0 per D-42-03. Civic-DID auth (HMAC-SHA1 short-lived
  # credentials via GET /api/v1/p2p/turn-credentials) gates abuse, not billing.
  #
  # Dev profile: STUN + TURN on UDP 3478 / TCP 3478 / TURNS 5349.
  # The UDP 49152-65535 relay range is OMITTED in dev (macOS Docker Desktop
  # cannot map large UDP port ranges efficiently — RESEARCH §Pitfall macOS UDP).
  # For production AWS:
  #   - open security group UDP 3478 + UDP 49152-65535
  #   - uncomment the "49152-65535:49152-65535/udp" port mapping below
  #   - or run coturn host-network mode for full relay capability.
  coturn:
    image: coturn/coturn:4.6.3
    container_name: noesis-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      # Production-only — uncomment for AWS deployment with security group rule:
      # - "49152-65535:49152-65535/udp"
    environment:
      DETECT_EXTERNAL_IP: "yes"
      STATIC_AUTH_SECRET: "${TURN_STATIC_AUTH_SECRET:-changeme-turn-secret}"
    command: >
      -f
      --use-auth-secret
      --realm=noesis.grid
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-changeme-turn-secret}
      --min-port=49152
      --max-port=65535
      --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
    restart: unless-stopped

volumes:
  mysql_data:
  sockets:
