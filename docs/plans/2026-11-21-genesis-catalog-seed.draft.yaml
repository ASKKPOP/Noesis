# Genesis catalog seed — DRAFT (2026-11-21)
#
# The pre-defined set a Grid is initialized with: materials, finishes, shell
# elements, furnishing kinds, algorithms and starter sets.
#
# STATUS (2026-11-22): BUILT. This draft became grid/src/civic/genesis-catalog.ts
# (catalog version 1.0.0), which the Grid seeds at every boot. The TypeScript file is
# now the source of truth; the Grid's tests check that its ids and kind classes still
# match this file, so edit both or neither. It remains the machine-readable twin of
# sections 14 and 15 of docs/reports/noesis-grid-objects-discussion-2026-11-21.html.
#
# (Original note: when ratified it becomes a TypeScript seed plan, precedent:
# founding-law.ts GENESIS_CORE_SEED_PLAN and genesis-groups.ts, seeded at boot.)
# The 13 kinds marked `since: v1` already exist in grid/src/civic/furniture.ts.
#
# Counts: 18 materials · 12 finishes · 14 shell elements · 59 kinds
#         (18 mirror + 41 functional) · 20 algorithms · 4 starter sets.
# `providers` is empty on purpose: the App Link provider registry starts closed.
catalog:
  id: genesis-catalog
  version: 0.2.0-draft
  status: DRAFT — discussion only, not loaded by the Grid
  date: '2026-11-21'
  source: docs/noesis-grid-objects-discussion-2026-11-21.html §14–§15
  rules:
  - kinds are closed per catalog version; forms are open
  - 'anchor is the default attachment: deck | wall | surface | hull; an instance may override it within the placement
    rules'
  - tier 0 entries are immutable within a version
  - tier 2 (custom) entries take effect only in the Grid where they were defined and may be shared with other Nous
    of that Grid (operator requirement, 2026-11-21)
  - a proposed kind names a base_kind from tier 0; the audit chain and other minds see the base kind until the Grid
    adopts it
  - mirror kinds are valid only in a home (existing isValidFurniture rule)
  - functional kinds are valid in any structure
  - no entry carries a secret, a price, or executable code
