# ─────────────────────────────────────────────────────────────────────────────
# Noēsis — PRODUCTION OVERLAY · HYBRID HOSTING.
#   • api + traefik → their own SUBDOMAINS
#   • guide / dashboard / steward → PATHS under the apex domain
# Use TOGETHER with the base compose:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build \
#       traefik guide mysql grid dashboard steward   # (add coturn for P2P)
#
# DNS A-records → server public IP:
#
#   ${DOMAIN}            → guide (/) · dashboard (/dash) · steward (/console)
#   api.${DOMAIN}        → Portal + Grid   (container: grid, :8080)   ← REQUIRED
#   traefik.${DOMAIN}    → Traefik admin UI (basic-auth protected)
#   coturn.${DOMAIN}     → coturn (DIRECT — not HTTP; turn:coturn.${DOMAIN}:3478/5349)
#
# So only the apex paths and two subdomains. coturn keeps its own A-record but is
# reached on its ports directly (TURN is not HTTP, can't be a Traefik route).
#
# CORS: the web UIs live at https://${DOMAIN}/dash|/console but call the Grid at
# https://api.${DOMAIN} — cross-origin — so GRID_CORS_ORIGINS=https://${DOMAIN}
# is wired below. Dashboard/steward bundles are rebuilt with
# NEXT_PUBLIC_GRID_ORIGIN=https://api.${DOMAIN} + NEXT_PUBLIC_BASE_PATH=/dash|/console
# (Next inlines these at BUILD time — you MUST `--build` after changing DOMAIN).
#
# Traefik fetches free Let's Encrypt TLS certs automatically (set ACME_EMAIL).
# Required env (.env):
#   DOMAIN=noesiis.com
#   ACME_EMAIL=you@example.com
#   TRAEFIK_DASHBOARD_AUTH=admin:$$apr1$$...    # htpasswd -nbB admin 'pass'
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Traefik: public door (80/443) + its own admin UI on a subdomain ─────────
  traefik:
    image: traefik:v3.1
    container_name: noesis-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: "Host(`traefik.${DOMAIN:-localhost}`)"
      traefik.http.routers.traefik.entrypoints: "websecure"
      traefik.http.routers.traefik.tls.certresolver: "le"
      traefik.http.routers.traefik.service: "api@internal"
      traefik.http.routers.traefik.middlewares: "traefik-auth"
      traefik.http.middlewares.traefik-auth.basicauth.users: "${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$changeme$$changeme}"
    restart: unless-stopped

  # ── Services Guide (static) — apex catch-all, LOWEST priority ───────────────
  guide:
    build:
      context: .
      dockerfile: docker/Dockerfile.guide
    container_name: noesis-guide
    labels:
      traefik.enable: "true"
      # Bare Host() matches every apex path; priority 1 means /dash /console
      # (longer rules) win first.
      traefik.http.routers.guide.rule: "Host(`${DOMAIN:-localhost}`)"
      traefik.http.routers.guide.priority: "1"
      traefik.http.routers.guide.entrypoints: "websecure"
      traefik.http.routers.guide.tls.certresolver: "le"
      traefik.http.services.guide.loadbalancer.server.port: "80"
    restart: unless-stopped

  # ── Portal + Grid → api.${DOMAIN} (whole subdomain). CORS allows the apex ───
  grid:
    environment:
      GRID_CORS_ORIGINS: "https://${DOMAIN:-localhost}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.grid.rule: "Host(`api.${DOMAIN:-localhost}`)"
      traefik.http.routers.grid.entrypoints: "websecure"
      traefik.http.routers.grid.tls.certresolver: "le"
      traefik.http.services.grid.loadbalancer.server.port: "8080"

  # ── Dashboard → ${DOMAIN}/dash (Next basePath=/dash; API at api.${DOMAIN}) ───
  dashboard:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: "/dash"
        NEXT_PUBLIC_GRID_ORIGIN: "https://api.${DOMAIN:-localhost}"
    # Next serves /api/dash/health under the basePath.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/dash/api/dash/health"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`${DOMAIN:-localhost}`) && PathPrefix(`/dash`)"
      traefik.http.routers.dashboard.priority: "50"
      traefik.http.routers.dashboard.entrypoints: "websecure"
      traefik.http.routers.dashboard.tls.certresolver: "le"
      traefik.http.services.dashboard.loadbalancer.server.port: "3001"

  # ── Steward Console → ${DOMAIN}/console (Next basePath=/console) ─────────────
  steward:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: "/console"
        NEXT_PUBLIC_GRID_ORIGIN: "https://api.${DOMAIN:-localhost}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/console/api/health"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.steward.rule: "Host(`${DOMAIN:-localhost}`) && PathPrefix(`/console`)"
      traefik.http.routers.steward.priority: "50"
      traefik.http.routers.steward.entrypoints: "websecure"
      traefik.http.routers.steward.tls.certresolver: "le"
      traefik.http.services.steward.loadbalancer.server.port: "3002"

volumes:
  letsencrypt:
