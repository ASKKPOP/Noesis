# ─────────────────────────────────────────────────────────────────────────────
# Noēsis — PRODUCTION OVERLAY · SUBDOMAIN HOSTING (one service per subdomain).
# Use TOGETHER with the base compose:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build \
#       traefik guide mysql grid dashboard steward   # (add coturn for P2P)
#
# Point these DNS A-records at the server's public IP, then it's live:
#
#   ${DOMAIN}            → Services Guide   (container: guide,   :80)
#   guide.${DOMAIN}      → Services Guide   (alias)
#   api.${DOMAIN}        → Portal + Grid    (container: grid,    :8080)  ← REQUIRED
#   dash.${DOMAIN}       → Dashboard        (container: dashboard, :3001)
#   console.${DOMAIN}    → Steward Console  (container: steward,   :3002)
#   traefik.${DOMAIN}    → Traefik dashboard (admin UI, basic-auth protected)
#
# coturn is NOT routed by Traefik — it is not HTTP. Give it a direct A-record
#   coturn.${DOMAIN}  → server IP   (or reuse the apex name) and reach it at
#   turn:coturn.${DOMAIN}:3478 / :5349 — open UDP/TCP 3478 + TLS 5349.
#
# CORS: subdomains are cross-origin, so the Grid must allow the dashboard/steward
# origins — wired below via GRID_CORS_ORIGINS. The dashboard/steward bundles are
# rebuilt with NEXT_PUBLIC_GRID_ORIGIN=https://api.${DOMAIN} (Next inlines this at
# BUILD time — you MUST `--build` after changing DOMAIN).
#
# Traefik fetches free Let's Encrypt TLS certs automatically (set ACME_EMAIL).
# Required env (.env):
#   DOMAIN=noesiis.com
#   ACME_EMAIL=you@example.com
#   TRAEFIK_DASHBOARD_AUTH=admin:$$apr1$$....   # htpasswd -nbB admin 'pass' (escape $ as $$ if inline)
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Traefik: the single public door (80/443). Also serves its own admin UI ──
  traefik:
    image: traefik:v3.1
    container_name: noesis-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP → HTTPS.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Automatic TLS via Let's Encrypt (TLS-ALPN challenge).
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Enable the Traefik dashboard (served via the internal api@internal service).
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    labels:
      traefik.enable: "true"
      # traefik.${DOMAIN} → the admin dashboard (api@internal), behind basic-auth.
      traefik.http.routers.traefik.rule: "Host(`traefik.${DOMAIN:-localhost}`)"
      traefik.http.routers.traefik.entrypoints: "websecure"
      traefik.http.routers.traefik.tls.certresolver: "le"
      traefik.http.routers.traefik.service: "api@internal"
      traefik.http.routers.traefik.middlewares: "traefik-auth"
      # htpasswd users — set TRAEFIK_DASHBOARD_AUTH in .env (user:hashed-pass).
      traefik.http.middlewares.traefik-auth.basicauth.users: "${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$changeme$$changeme}"
    restart: unless-stopped

  # ── Services Guide (static) — apex + guide. alias ───────────────────────────
  guide:
    build:
      context: .
      dockerfile: docker/Dockerfile.guide
    container_name: noesis-guide
    labels:
      traefik.enable: "true"
      traefik.http.routers.guide.rule: "Host(`${DOMAIN:-localhost}`) || Host(`guide.${DOMAIN:-localhost}`)"
      traefik.http.routers.guide.entrypoints: "websecure"
      traefik.http.routers.guide.tls.certresolver: "le"
      traefik.http.services.guide.loadbalancer.server.port: "80"
    restart: unless-stopped

  # ── Portal + Grid → api.${DOMAIN}. CORS allows the dashboard/steward origins ─
  grid:
    environment:
      GRID_CORS_ORIGINS: "https://${DOMAIN:-localhost},https://dash.${DOMAIN:-localhost},https://console.${DOMAIN:-localhost}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.grid.rule: "Host(`api.${DOMAIN:-localhost}`)"
      traefik.http.routers.grid.entrypoints: "websecure"
      traefik.http.routers.grid.tls.certresolver: "le"
      traefik.http.services.grid.loadbalancer.server.port: "8080"

  # ── Dashboard → dash.${DOMAIN}. Client calls api.${DOMAIN} (baked at build) ──
  dashboard:
    build:
      args:
        NEXT_PUBLIC_GRID_ORIGIN: "https://api.${DOMAIN:-localhost}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`dash.${DOMAIN:-localhost}`)"
      traefik.http.routers.dashboard.entrypoints: "websecure"
      traefik.http.routers.dashboard.tls.certresolver: "le"
      traefik.http.services.dashboard.loadbalancer.server.port: "3001"

  # ── Steward Console → console.${DOMAIN} ─────────────────────────────────────
  steward:
    build:
      args:
        NEXT_PUBLIC_GRID_ORIGIN: "https://api.${DOMAIN:-localhost}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.steward.rule: "Host(`console.${DOMAIN:-localhost}`)"
      traefik.http.routers.steward.entrypoints: "websecure"
      traefik.http.routers.steward.tls.certresolver: "le"
      traefik.http.services.steward.loadbalancer.server.port: "3002"

volumes:
  letsencrypt:
