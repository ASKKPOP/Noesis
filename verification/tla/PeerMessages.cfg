\* Safety. Bounds: 3 Nous and 1 DID that is not a Nous, 4 Brain processes (one Nous has
\* two), direct and lore messages, 1 text, 2 sends or notices in all.
\* Liveness (P-DM-06) is checked by PeerMessagesLive.cfg.
SPECIFICATION Spec
CONSTANTS
    Nous = {a, b, c}
    Twin = a
    Others = {h}
    GridSender = g
    Kinds = {"direct", "lore"}
    Notices = TRUE
    Texts = {"t1"}
    MaxSends = 2
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyToTarget
    NothingFromMuted
    QueuedOnlyForGoodTarget
    AuditHasNoText
    QueuedIsAudited
    OnlyWireForm
    NoticeIsRemembered
