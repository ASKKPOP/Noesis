\* Bounds: 3 replicas, at most 4 writes in all (the first is the create),
\* physical clock readings 0..1.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    MaxWrites = 4
    MaxTime = 1
INVARIANTS
    TypeOK
    Converged
    LastWriteWins
    DeletedIffDeleteSeen
    AllStampsValid
    ClockCondition
PROPERTIES
    StaleChangesNothing
    NeverBackward
    InvalidChangesNothing
